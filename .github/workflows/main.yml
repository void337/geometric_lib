name: Python Unit Tests

on:
  push:
    branches: [ main, master, doc_branch ]
 
jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install pytest
        run: pip install pytest
      
      - name: Run unit tests
        run: python -m pytest -v